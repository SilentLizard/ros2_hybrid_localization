amcl:
  ros__parameters:
    use_sim_time: true
    base_frame_id: base_link
    odom_frame_id: odom
    global_frame_id: map
    scan_topic: scan
    map_topic: map
    tf_broadcast: true

    # Start deterministically for simulator validation; later scenarios should
    # override/disable this for global-localization experiments.
    set_initial_pose: true
    always_reset_initial_pose: true
    initial_pose: {x: 0.0, y: 0.0, z: 0.0, yaw: 0.0}

    robot_model_type: nav2_amcl::DifferentialMotionModel
    laser_model_type: likelihood_field
    max_beams: 90
    laser_likelihood_max_dist: 2.0

    min_particles: 500
    max_particles: 2500
    random_seed: 41
    pf_err: 0.05
    pf_z: 0.99
    resample_interval: 1

    # Larger platform than TurtleBot: do not update on every millimeter.
    update_min_d: 0.08
    update_min_a: 0.05

    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2

    z_hit: 0.5
    z_rand: 0.5
    z_max: 0.05
    z_short: 0.05
    sigma_hit: 0.2
    lambda_short: 0.1
    do_beamskip: false
    transform_tolerance: 1.0
