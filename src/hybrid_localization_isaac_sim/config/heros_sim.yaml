# HEROS simulator constants.
# Source: innok_heros_description 1.0.4 unless marked SIMULATION ASSUMPTION.
robot:
  variant: heros_3w
  wheel_radius: 0.16
  wheel_separation: 0.58
  max_linear_speed: 1.0
  max_angular_speed: 2.0
  footprint:
    frame: base_link
    points:
      - [1.16, 0.39]
      - [-0.60, 0.39]
      - [-0.60, -0.39]
      - [1.16, -0.39]

frames:
  base: base_link
  odom: odom
  map: map
  scan_mount: base_scan
  scan: lidar_frame

lidar:
  model: SICK_microScan3
  # SIMULATION ASSUMPTION: scanner model/mount are not present in the Innok
  # description package. Values below match the validated HEROS Isaac fixture.
  mount_xyz: [0.95, 0.0, 0.10]
  mount_rpy: [0.0, 0.0, 0.0]
  # The validated sensor is already oriented correctly in Isaac.
  scan_frame_yaw_degrees: 0.0
