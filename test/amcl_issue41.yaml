amcl:
  ros__parameters:
    use_sim_time: true

    # Isaac Sim frame/topic contract
    base_frame_id: base_link
    odom_frame_id: odom
    global_frame_id: map
    scan_topic: scan
    map_topic: map
    tf_broadcast: true

    # Deterministic validation initialization. This assumes the Isaac fixture
    # starts the robot at the map origin-aligned pose used by the current map.
    set_initial_pose: true
    always_reset_initial_pose: true
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0

    # Standard differential-drive AMCL model.
    robot_model_type: nav2_amcl::DifferentialMotionModel
    laser_model_type: likelihood_field
    max_beams: 60
    laser_min_range: -1.0
    laser_max_range: -1.0
    laser_likelihood_max_dist: 2.0

    # Keep the validation cloud reasonably sized and deterministic.
    min_particles: 500
    max_particles: 2000
    random_seed: 41
    pf_err: 0.05
    pf_z: 0.99
    resample_interval: 1

    # Lower motion thresholds for the interface-validation run so particle
    # clouds are easy to observe during slow joystick motion.
    update_min_d: 0.05
    update_min_a: 0.05

    # Standard differential odometry noise starting point.
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2

    z_hit: 0.5
    z_rand: 0.5
    z_max: 0.05
    z_short: 0.05
    sigma_hit: 0.2
    lambda_short: 0.1

    do_beamskip: false
    transform_tolerance: 1.0
